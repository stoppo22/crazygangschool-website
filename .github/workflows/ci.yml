name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $i), retrying in 20s..." >&2
            sleep 20
          done
          exit 1

      - name: Build and run browser checks
        run: |
          npm run build
          npm run dev &
          DEV_PID=$!
          npx --yes wait-on tcp:127.0.0.1:5173 --timeout 60000
          npm run test:browser
          kill $DEV_PID 2>/dev/null || true

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: artifacts/
          retention-days: 7
