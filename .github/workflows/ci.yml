name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Playwright's own image ships Chromium + all system libs, so there is no
    # flaky "playwright install --with-deps" step. Tag matches `playwright` in
    # package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run browser checks
        run: |
          npm run build
          npm run dev &
          DEV_PID=$!
          npx --yes wait-on tcp:127.0.0.1:5173 --timeout 60000
          npm run test:browser
          kill $DEV_PID 2>/dev/null || true

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: artifacts/
          retention-days: 7
